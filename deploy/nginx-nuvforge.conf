# Nuvforge + NuvTax nginx config
# Place at: /etc/nginx/sites-available/nuvforge.conf
# Enable:   sudo ln -s /etc/nginx/sites-available/nuvforge.conf /etc/nginx/sites-enabled/
# Test:     sudo nginx -t && sudo systemctl reload nginx

# ---------- nuvforge.com ----------
server {
    listen 80;
    listen [::]:80;
    server_name nuvforge.com www.nuvforge.com;

    root /var/www/nuvforge/site;
    index index.html;

    # www -> apex
    if ($host = www.nuvforge.com) {
        return 301 https://nuvforge.com$request_uri;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    location ~* \.(png|jpg|jpeg|webp|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ---------- tax.nuvforge.com ----------
server {
    listen 80;
    listen [::]:80;
    server_name tax.nuvforge.com;

    root /var/www/nuvforge/tax;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    location ~* \.(png|jpg|jpeg|webp|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }
}

# NOTE ON SSL:
# Recommended: Cloudflare Origin Certificate (Cloudflare dashboard -> SSL/TLS -> Origin Server
# -> Create Certificate). Save cert/key on the VPS, then add to each server block:
#     listen 443 ssl;
#     ssl_certificate     /etc/ssl/cloudflare/nuvforge.pem;
#     ssl_certificate_key /etc/ssl/cloudflare/nuvforge.key;
# and set Cloudflare SSL/TLS mode to "Full (strict)".
# Alternative: certbot --nginx -d nuvforge.com -d www.nuvforge.com -d tax.nuvforge.com
